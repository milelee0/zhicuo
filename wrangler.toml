name = "zhicuo"
main = "cloudflare/worker.mjs"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# 静态前端
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Cloudflare D1 数据库
[[d1_databases]]
binding = "DB"
database_name = "zhicuo"
database_id = "a222a020-8606-4a42-b597-479214fbe103"
migrations_dir = "cloudflare/migrations"

[vars]
# APP_PASSWORD / APP_SECRET 请用 `wrangler secret put` 设置，不要写进仓库。
# 可选：AI_API_KEY / AI_BASE_URL / AI_MODEL / AI_VISION_MODEL 也可以放在 Worker secrets。
